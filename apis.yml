name: Lottie
description: 'Lottie is a UK-based later-life care marketplace that helps families and retirees find
  and fund the country''s best care homes, home care providers, and retirement living communities. The
  free consumer service matches people with regulated care providers, publishes availability and pricing,
  and offers guidance from care experts alongside a large library of funding and care guides. Backed by
  Accel and General Catalyst, Lottie serves tens of thousands of families monthly across England, Scotland,
  and Wales. As of this enrichment pass the company operates a consumer-facing web platform only and
  publishes no public developer API, OpenAPI specification, or developer portal.'
